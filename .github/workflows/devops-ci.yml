
name: DevOps CI-CD

on:
  push:
    branches:
      - feature/github-actions

  pull_request:
    branches:
      - feature/github-actions

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "356627769772"
  ECR_REPOSITORY: ezbookkeeping

jobs:
  build:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Go application
        run: go build ./...

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$GITHUB_SHA" \
            .

      - name: Diagnose GitHub OIDC context
        if: github.event_name == 'push'
        env:
          GH_EVENT: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "Event: $GH_EVENT"
          echo "Ref: $GH_REF"
          echo "Repository: $GH_REPOSITORY"
          echo "Actor: $GH_ACTOR"

      - name: Configure AWS credentials using OIDC
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::356627769772:role/ezbookkeeping-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        if: github.event_name == 'push'
        run: |
          docker push \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$GITHUB_SHA"
