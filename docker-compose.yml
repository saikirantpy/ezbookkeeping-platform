services:
  app:
    image: 306404/ezbookkeeping-platform:v3
    container_name: ezbookkeeping
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - app-data:/ezbookkeeping/data
    depends_on:
      - postgres
    networks:
      - app-network

  postgres:
    image: postgres:17
    container_name: ezbookkeeping-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ezbookkeeping
      POSTGRES_USER: ezuser
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  app-data:
  postgres-data:

networks:
  app-network: