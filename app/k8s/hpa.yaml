apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: ezbookkeeping-hpa
  namespace: ezbookkeeping

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ezbookkeeping

  minReplicas: 1
  maxReplicas: 5

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
